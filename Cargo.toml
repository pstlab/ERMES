[package]
name = "ermes"
version = "0.1.0"
authors = ["Riccardo De Benedictis"]
edition = "2024"
description = "Urban Ecosystem for Active and Healthy Aging"
readme = "README.md"
repository = "https://github.com/pstlab/ERMES"
license-file = "LICENSE.txt"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tokio = { version = "1.54.1", features = ["full"] }
rust-embed = "8.13.0"
coco-reasoner = { git = "https://github.com/pstlab/CoCo", features = [
    "auth",
    "mqtt",
] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.154", features = ["derive"] }
serde_json = "1.0.154"
rsa = { version = "0.9.10", features = ["sha2"] }
rand = "0.10.3"
hex = "0.4.3"
async-trait = "0.1.92"
google-cloud-pubsub = "1.7.0"
google-cloud-default = "0.4.0"
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
